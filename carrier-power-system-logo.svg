<svg width="680" height="220" viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Carrier Power System logo</title>
<desc>A logo mark showing a signal tower with three carrier nodes and radiating signal waves, next to the wordmark "Carrier Power System" with the tagline "ML-based adaptive carrier management".</desc>
<defs>
<linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#2563EB"/>
<stop offset="1" stop-color="#06B6D4"/>
</linearGradient>
</defs>

<rect x="40" y="40" width="120" height="120" rx="28" fill="url(#badgeGrad)"/>

<rect x="88" y="66" width="14" height="68" rx="6" fill="#EAF4FF"/>

<circle cx="95" cy="80" r="7" fill="#22D3A6"/>
<circle cx="95" cy="100" r="7" fill="#FBBF24"/>
<circle cx="95" cy="120" r="7" fill="#22D3A6"/>

<path d="M116 70 A32 32 0 0 1 116 130" fill="none" stroke="#EAF4FF" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
<path d="M126 58 A50 50 0 0 1 126 142" fill="none" stroke="#EAF4FF" stroke-width="3" stroke-linecap="round" opacity="0.55"/>

<text x="192" y="112" font-size="38" font-weight="500" fill="#0F172A" font-family="'Segoe UI', sans-serif">Carrier Power System</text>
<text x="192" y="140" font-size="15" font-weight="400" fill="#64748B" font-family="'Segoe UI', sans-serif">ML-based adaptive carrier management</text>
</svg>
